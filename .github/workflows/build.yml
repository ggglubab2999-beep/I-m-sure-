name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check required app files
        run: |
          missing=0
          for f in main.py core.py android_utils.py buildozer.spec icon.png; do
            if [ ! -f "$f" ]; then echo "::error::Missing required file in repository root: $f"; missing=1; fi
          done
          exit $missing

      - name: Run unit tests (optional, skipped if tests folder is absent)
        run: |
          if [ -f tests/test_core.py ] && [ -f tests/test_flow.py ]; then
            python tests/test_core.py
            python tests/test_flow.py
          else
            echo "tests/ folder not found - skipping tests"
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev automake build-essential \
            ccache libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0 'cython==0.29.36'

      - name: Cache Buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build debug APK
        run: |
          yes | buildozer -v android debug

      - name: Verify APK exists
        run: |
          set -e
          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          ls -lh bin/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cx-downloader-red-alert-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
